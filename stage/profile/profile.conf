# Cockpit user profile. This file controls optional, user-owned skills that
# SETUP can preview and explicitly add to a provider's project instruction
# file. Nothing here is copied into a project automatically.

[profile]
name=default
enabled=1
skills_dir=~/.config/cockpit/skills.d
# Optional comma-separated skill names or paths. When omitted, all *.md and
# *.mdc files directly under skills_dir are available.
# skills=cockpit-safe-updates,review-checklist
