# Cockpit Laya router (optional). Copied to ~/.config/cockpit/laya.conf on the
# first `cockpit laya` command when absent. Read as key=value data, never sourced.
# Environment wins: COCKPIT_LAYA=0 hard-disables routing (=1 enables);
# COCKPIT_LAYA_URL, COCKPIT_LAYA_TIMEOUT_MS, COCKPIT_LAYA_MIN_CONFIDENCE,
# COCKPIT_LAYA_DEFAULT_TIER, COCKPIT_LAYA_MAX_TIER and COCKPIT_LAYA_DEVICE
# override the keys below. url must stay on loopback (127.0.0.1 or localhost).
enabled=0
url=http://127.0.0.1:8765
device=auto
timeout_ms=400
min_confidence=0.60
default_tier=cheap
max_tier=top
