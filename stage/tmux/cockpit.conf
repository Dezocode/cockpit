# Workspace Cockpit overlay on Omarchy's stock tmux.conf.
# Shared by Foot (pad) and Termius iOS (tabs). Profile-specific chrome is
# applied per attach by the Cockpit layout adapter via @cockpit_profile.

set -ag terminal-features "foot:RGB:extkeys:clipboard"
set -ag terminal-features "xterm-256color:RGB:mouse"
# Termius is xterm-256color. Disable BEL so Codex spinner frames stay
# visible without vibrating the phone. Foot keeps its own bel.
set -ag terminal-overrides ",xterm-256color:XT:Ms=\\E]52;%p1%s;%p2%s\\007:bel@"
# Do not tear down the server when the last session is gone (Termius
# reconnect / gate races). Cockpit recreates the session on next launch.
set -s exit-empty off
set -g destroy-unattached off
set -g detach-on-destroy off

# The legacy session pattern is compatibility-only; all bound commands are
# canonical cockpit entrypoints.

bind -N "Show Workspace Cockpit help" H run-shell "cockpit-popup HELP cockpit-help"
bind -N "Focus live Agent page" a run-shell -b "cockpit-touch '#{session_name}' agent"
bind -N "Open GitHub PR dashboard" g run-shell -b "cockpit-touch '#{session_name}' prs"
bind -N "Focus Mermaid overview" d run-shell -b "cockpit-touch '#{session_name}' map"
bind -N "Focus memory map" y run-shell -b "cockpit-touch '#{session_name}' memory"
bind -N "Focus files pane" f run-shell -b "cockpit-touch '#{session_name}' files"
bind -N "Focus diff pane" D run-shell -b "cockpit-touch '#{session_name}' diff"
bind -N "Open Vim diff view" V run-shell -b "cockpit-popup VIMDIFF cockpit-vimdiff '#{session_name}'"
bind -N "Cockpit pane menu" m if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { run-shell "cockpit-menu '#{session_name}'" }
bind -N "Open Agent setup" s run-shell -b "cockpit-touch '#{session_name}' setup"
bind -N "Auth provider popup" A run-shell -b "cockpit-auth popup"
bind -N "Auth GitHub popup" G run-shell -b "cockpit-auth popup github"
bind -N "Switch Agent provider / model" e run-shell -b "cockpit-runtime popup '#{session_name}'"
bind -N "Restart live Agent" R run-shell -b "cockpit-restart '#{session_name}'"
bind -N "Keyboard / desktop actions" k run-shell -b "cockpit-modality keyboard '#{session_name}' #{client_width} #{client_height}"
bind -N "Touch / mobile layout" t run-shell -b "cockpit-modality touch '#{session_name}' #{client_width} #{client_height}"
bind -N "Next pane" C-i select-pane -t :.+1
bind -N "Previous pane" S-Tab select-pane -t :.-1
bind -N "Zoom active pane" z resize-pane -Z

bind -N "Double-click runtime for AGENT zoom" -n DoubleClick1Pane if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { run-shell -b "cockpit-agent '#{session_name}' '' ''" }

# Termius: PATH in run-shell is often empty. Quote every mouse field so an
# empty #{mouse_x} cannot shift the pane id into the wrong slot. The pointer
# resolves the pane under the event with tmux's supported `=` target.
# Ignore release events. Press+release used to double-fire MODEL and BEL.
bind -N "Ignore tap release" -n MouseUp1Pane {}
bind -N "Ignore status release" -n MouseUp1Status {}
bind -N "Ignore status-left release" -n MouseUp1StatusLeft {}
bind -N "Ignore border release" -n MouseUp1Border {}
bind -N "Native border selection" -n MouseDown1Border select-pane -M

bind -N "Tap PRS provider MODEL RESTART" -n MouseDown1Pane {
  select-pane -t =
  run-shell -b 'PATH="$HOME/.local/bin:$PATH" cockpit-pointer pane "#{mouse_x}" "#{mouse_y}" "" "#{session_name}" ""'
}

# Native window ranges on the status line. The pointer resolves the clicked
# window after tmux selects the event target with its supported `=` token;
# `mouse_window` is not a variable.
bind -N "Tab row tap" -n MouseDown1Status {
  select-window -t =
  run-shell -b 'PATH="$HOME/.local/bin:$PATH" cockpit-pointer status "#{session_name}" "#{mouse_status_range}" ""'
}

# The COCKPIT status block is the setup button.
bind -N "Open Agent setup from COCKPIT" -n MouseDown1StatusLeft {
  run-shell -b 'PATH="$HOME/.local/bin:$PATH" cockpit-pointer status-left "#{session_name}"'
}

# A Termius tap almost always includes a few pixels of drag. Copy-mode after
# that makes the next press miss. Keep drag-select on Foot / desktop.
bind -N "Swallow Termius drag on chips" -n MouseDrag1Pane {
  if-shell -F '#{&&:#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}},#{==:#{@cockpit_profile},termius-ios}}' {
  } {
    if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M }
  }
}
bind -N "Swallow Termius border drag" -n MouseDrag1Border {
  if-shell -F '#{&&:#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}},#{==:#{@cockpit_profile},termius-ios}}' {
  } {
    resize-pane -M
  }
}

# Omarchy Alt+number / Alt+Escape are ESC-prefixed. Termius taps must not
# switch windows or kill panes, and the CSI must not land in a page.
bind -N "Swallow Alt-1 in cockpit" -n M-1 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { } { select-window -t 1 }
bind -N "Swallow Alt-2 in cockpit" -n M-2 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { } { select-window -t 2 }
bind -N "Swallow Alt-3 in cockpit" -n M-3 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { } { select-window -t 3 }
bind -N "Swallow Alt-4 in cockpit" -n M-4 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { } { select-window -t 4 }
bind -N "Swallow Alt-5 in cockpit" -n M-5 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { } { select-window -t 5 }
bind -N "Swallow Alt-6 in cockpit" -n M-6 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { } { select-window -t 6 }
bind -N "Swallow Alt-7 in cockpit" -n M-7 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { } { select-window -t 7 }
bind -N "Swallow Alt-8 in cockpit" -n M-8 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { } { select-window -t 8 }
bind -N "Swallow Alt-9 in cockpit" -n M-9 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { } { select-window -t 9 }
bind -N "Swallow Alt-Escape in cockpit" -n M-Escape if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { } { kill-pane }
bind -N "Swallow status wheel down" -n WheelDownStatus if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { } { next-window }
bind -N "Swallow status wheel up" -n WheelUpStatus if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { } { previous-window }

# Keyboard and click always work in this session. Idle type/click only
# updates stored desktop/touch chrome; it does not disable the other input.
bind -N "Cockpit Agent" -n F1 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { run-shell -b "cockpit-touch '#{session_name}' agent" } { send-keys F1 }
bind -N "Cockpit files" -n F2 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { run-shell -b "cockpit-touch '#{session_name}' files" } { send-keys F2 }
bind -N "Cockpit diff" -n F3 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { run-shell -b "cockpit-touch '#{session_name}' diff" } { send-keys F3 }
bind -N "Cockpit map" -n F4 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { run-shell -b "cockpit-touch '#{session_name}' map" } { send-keys F4 }
bind -N "Cockpit PRs" -n F5 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { run-shell -b "cockpit-touch '#{session_name}' prs" } { send-keys F5 }
bind -N "Cockpit help" -n F6 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { run-shell -b "cockpit-touch '#{session_name}' help" } { send-keys F6 }
bind -N "Cockpit Agent switcher" -n F7 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { run-shell -b "cockpit-runtime popup '#{session_name}'" } { send-keys F7 }
bind -N "Cockpit Agent setup" -n F8 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { run-shell -b "cockpit-touch '#{session_name}' setup" } { send-keys F8 }
bind -N "Cockpit legacy setup editor" -n F9 if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { run-shell -b "cockpit-touch '#{session_name}' setup-edit" } { send-keys F9 }
bind -N "Cockpit long-press menu" -n MouseDown3Pane if-shell -F '#{||:#{m:cockpit*,#{session_name}},#{m:codex-cockpit*,#{session_name}}}' { run-shell "cockpit-menu '#{session_name}'" } { paste-buffer -p }

# hooks-install and probe-install are invoked from the launcher / idle
# watcher so `tmux source-file` works with no attached client.
