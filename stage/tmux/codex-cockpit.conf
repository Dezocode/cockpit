# Codex cockpit overlay on Omarchy's stock tmux.conf.
# Shared by Foot (pad) and Termius iOS (tabs). Profile-specific chrome is
# applied per attach by codex-cockpit-adapt via @cockpit_profile.

set -ag terminal-features "foot:RGB:extkeys:clipboard"

bind -N "Show Codex cockpit help" H run-shell "codex-cockpit-popup HELP codex-cockpit-help"
bind -N "Focus live Codex agent" a run-shell -b "codex-cockpit-touch '#{session_name}' runtime"
bind -N "Open GitHub PR dashboard" g run-shell -b "codex-cockpit-touch '#{session_name}' prs"
bind -N "Focus Mermaid overview" d run-shell -b "codex-cockpit-touch '#{session_name}' map"
bind -N "Focus files pane" f run-shell -b "codex-cockpit-touch '#{session_name}' files"
bind -N "Focus diff pane" D run-shell -b "codex-cockpit-touch '#{session_name}' diff"
bind -N "Cockpit pane menu" m if-shell -F '#{m:codex-cockpit*,#{session_name}}' { run-shell "codex-cockpit-menu '#{session_name}'" }
bind -N "Auth provider popup" A run-shell -b "codex-cockpit-auth popup"
bind -N "Auth GitHub popup" G run-shell -b "codex-cockpit-auth popup github"
bind -N "Switch runtime / model" e run-shell -b "codex-cockpit-runtime popup '#{session_name}'"
bind -N "Keyboard / desktop actions" k run-shell -b "codex-cockpit-modality keyboard '#{session_name}' #{client_width} #{client_height}"
bind -N "Touch / mobile layout" t run-shell -b "codex-cockpit-modality touch '#{session_name}' #{client_width} #{client_height}"
bind -N "Next pane" C-i select-pane -t :.+1
bind -N "Previous pane" S-Tab select-pane -t :.-1
bind -N "Zoom active pane" z resize-pane -Z

bind -N "Double-click runtime for AGENT zoom" -n DoubleClick1Pane if-shell -F '#{m:codex-cockpit*,#{session_name}}' { run-shell -b "codex-cockpit-agent '#{mouse_session}' '#{mouse_window}' '#{mouse_pane}'" }

# AUTH chips: first tap is live. Runtime: pass the tap into Codex so the
# composer is clickable. Other pages: select only (no CSI typed into them).
bind -N "Tap AUTH runtime MODEL" -n MouseDown1Pane if-shell -F '#{m:codex-cockpit*,#{mouse_session}}' {
  if-shell -F '#{==:#{mouse_pane},#{@cockpit_bar_pane}}' {
    run-shell -b "codex-cockpit-bar click #{mouse_x} #{mouse_pane} #{mouse_session}"
  } {
    if-shell -F '#{==:#{mouse_pane},#{@cockpit_runtime_pane}}' {
      select-pane -t = ; send-keys -M
    } {
      select-pane -t =
    }
  }
} {
  select-pane -t = ; send-keys -M
}

# Nested-flow tap on the tab row closes the flow. It does not switch pages
# and does not inject ESC into the pane.
bind -N "Tab row tap" -n MouseDown1Status if-shell -F '#{m:codex-cockpit*,#{mouse_session}}' {
  run-shell -b "codex-cockpit-popup status-tap #{mouse_session} #{mouse_window}"
} {
  select-window -t =
}

# Omarchy Alt+number / Alt+Escape are ESC-prefixed. Termius taps must not
# switch windows or kill panes, and the CSI must not land in a page.
bind -N "Swallow Alt-1 in cockpit" -n M-1 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { } { select-window -t 1 }
bind -N "Swallow Alt-2 in cockpit" -n M-2 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { } { select-window -t 2 }
bind -N "Swallow Alt-3 in cockpit" -n M-3 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { } { select-window -t 3 }
bind -N "Swallow Alt-4 in cockpit" -n M-4 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { } { select-window -t 4 }
bind -N "Swallow Alt-5 in cockpit" -n M-5 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { } { select-window -t 5 }
bind -N "Swallow Alt-6 in cockpit" -n M-6 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { } { select-window -t 6 }
bind -N "Swallow Alt-7 in cockpit" -n M-7 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { } { select-window -t 7 }
bind -N "Swallow Alt-8 in cockpit" -n M-8 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { } { select-window -t 8 }
bind -N "Swallow Alt-9 in cockpit" -n M-9 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { } { select-window -t 9 }
bind -N "Swallow Alt-Escape in cockpit" -n M-Escape if-shell -F '#{m:codex-cockpit*,#{session_name}}' { } { kill-pane }
bind -N "Swallow status wheel down" -n WheelDownStatus if-shell -F '#{m:codex-cockpit*,#{session_name}}' { } { next-window }
bind -N "Swallow status wheel up" -n WheelUpStatus if-shell -F '#{m:codex-cockpit*,#{session_name}}' { } { previous-window }

# Keyboard and click always work in this session. Idle type/click only
# updates stored desktop/touch chrome; it does not disable the other input.
bind -N "Cockpit runtime" -n F1 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { run-shell -b "codex-cockpit-touch '#{session_name}' runtime" } { send-keys F1 }
bind -N "Cockpit files" -n F2 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { run-shell -b "codex-cockpit-touch '#{session_name}' files" } { send-keys F2 }
bind -N "Cockpit diff" -n F3 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { run-shell -b "codex-cockpit-touch '#{session_name}' diff" } { send-keys F3 }
bind -N "Cockpit map" -n F4 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { run-shell -b "codex-cockpit-touch '#{session_name}' map" } { send-keys F4 }
bind -N "Cockpit PRs" -n F5 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { run-shell -b "codex-cockpit-touch '#{session_name}' prs" } { send-keys F5 }
bind -N "Cockpit help" -n F6 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { run-shell -b "codex-cockpit-touch '#{session_name}' help" } { send-keys F6 }
bind -N "Cockpit runtimes" -n F7 if-shell -F '#{m:codex-cockpit*,#{session_name}}' { run-shell -b "codex-cockpit-runtime popup '#{session_name}'" } { send-keys F7 }
bind -N "Cockpit long-press menu" -n MouseDown3Pane if-shell -F '#{m:codex-cockpit*,#{session_name}}' { run-shell "codex-cockpit-menu '#{session_name}'" } { paste-buffer -p }

# hooks-install and probe-install are invoked from the launcher / idle
# watcher so `tmux source-file` works with no attached client.
