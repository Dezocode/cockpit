# Cockpit auth providers.
# Copy lives at ~/.config/cockpit/providers.conf (not overwritten).
# Drop more files in ~/.config/cockpit/providers.d/*.conf
#
# Each [id] is a source. check/login/on_ready are shell commands.
# Runtime providers may add models=model-a,model-b (or a pipe-separated list)
# and/or models_command=... for the SETUP MODEL picker. If neither is set,
# SETUP offers that provider's native picker without guessing model names.
# Optional model_apply=... receives COCKPIT_PROVIDER and COCKPIT_MODEL.
# Optional agent_file=, agent_files=, or agent_paths= selects the project
# instruction file for provider-aware Cockpit profile validation. If omitted,
# Cockpit detects .codex, .agent, and provider convention files without
# touching them.
# kind is documentation only (cli-oauth, device, token, …).
#
# Codex and Grok/xAI OAuth stay with those tools, while SETUP asks each
# provider's native status/cache probe so the indicator reflects real local
# authentication rather than only whether an auth file exists.

[github]
label=GitHub
kind=cli-oauth
check=command -v gh
auth_check=gh auth status -h github.com
login=gh auth login -h github.com -p https -w
on_ready=cockpit-ghui

[codex]
label=Codex
kind=runtime
check=command -v codex
probe=codex-login
login=codex login
start=codex
model_keys=/model
agent_paths=.codex/AGENTS.md,.codex,.agents/AGENTS.md,.agent/AGENTS.md,.agent,AGENTS.md,AGENT.md
# models=provider-model-a,provider-model-b
# models_command=provider-cli list-models
# model_apply=provider-cli use "$COCKPIT_MODEL"

[grok]
label=Grok
kind=runtime
check=command -v grok
probe=grok-cache
login=grok login --oauth
start=grok
model_keys=/model
agent_paths=.agent/AGENTS.md,.agent,.agents/AGENTS.md,AGENTS.md,AGENT.md,.grok/AGENTS.md,.codex/AGENTS.md,.codex
# models=provider-model-a,provider-model-b

[anthropic]
label=Anthropic
kind=runtime
check=command -v claude
auth_check=claude auth status 2>/dev/null | grep -q '"loggedIn": true'
login=claude auth login
start=claude
model_keys=/model
agent_paths=CLAUDE.md,.claude/CLAUDE.md,.agent/AGENTS.md,.agent,.agents/AGENTS.md,AGENTS.md,AGENT.md
# models=provider-model-a,provider-model-b

[cursor]
label=Cursor
kind=runtime
check=command -v cursor-agent
auth_check=cursor-agent status 2>&1 | grep -viq 'not logged in'
login=cursor-agent login
start=cursor-agent
model_keys=/model
agent_paths=.cursor/rules/cockpit.md,.cursor/rules,.agent/AGENTS.md,.agent,.agents/AGENTS.md,AGENTS.md,AGENT.md
# models=provider-model-a,provider-model-b

# Example — copy, uncomment, and fill in when you want another source:
# [gitlab]
# label=GitLab
# kind=cli-oauth
# check=glab auth status
# login=glab auth login
# on_ready=
