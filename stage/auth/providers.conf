# Codex Cockpit auth providers.
# Copy lives at ~/.config/codex-cockpit/providers.conf (not overwritten).
# Drop more files in ~/.config/codex-cockpit/providers.d/*.conf
#
# Each [id] is a source. check/login/on_ready are shell commands.
# kind is documentation only (cli-oauth, device, token, …).
#
# Codex CLI and Grok/xAI OAuth stay with those tools. Do not add them
# here unless you want a second copy of that login in a cockpit popup.

[github]
label=GitHub
kind=cli-oauth
check=gh auth status -h github.com
login=gh auth login -h github.com -p https -w
on_ready=codex-cockpit-ghui

[codex]
label=Codex
kind=runtime
check=command -v codex
start=codex
model_keys=/model

[grok]
label=Grok
kind=runtime
check=command -v grok
start=grok
model_keys=/model

[anthropic]
label=Anthropic
kind=runtime
check=command -v claude
start=claude
model_keys=/model

[cursor]
label=Cursor
kind=runtime
check=command -v cursor-agent
start=cursor-agent
model_keys=/model

# Example — copy, uncomment, and fill in when you want another source:
# [gitlab]
# label=GitLab
# kind=cli-oauth
# check=glab auth status
# login=glab auth login
# on_ready=
