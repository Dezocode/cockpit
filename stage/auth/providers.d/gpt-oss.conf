# Local open-source Codex runtime. Requires LM Studio or Ollama on this host.
[gpt-oss]
label=Open Source (gpt-oss)
kind=runtime
check=command -v codex
start=codex --oss
model_keys=/model
# Add models=... or models_command=... here when the local LM Studio/Ollama
# catalog should be shown in the shared SETUP MODEL picker.
