name: Setup Node and pnpm
description: Pin Node 22 and pnpm 9 with app lockfile cache
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 9
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: app/pnpm-lock.yaml
