name: CI

on:
  push:
    branches: [main, cockpit-gtm-v2.3]
  pull_request:
    branches: [main, cockpit-gtm-v2.3]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Build web + API
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec tsc -p tsconfig.server.json

      - name: Capability matrix
        run: bash bench/cockpit/capability-matrix.sh

      - name: Prove GET /api/health
        run: |
          COCKPIT_HOSTINGER=1 node app/dist-server/index.js &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8787/api/health >/tmp/health.json && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8787/api/health | tee /tmp/health.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/health.json"))
          assert d["product"] == "cockpit"
          assert d["status"] in ("green", "yellow")
          assert d["checks"]["hostinger"] == "configured"
          assert d.get("source") == "app/dist-server/index.js"
          print("health ok:", d["status"], "source:", d["source"])
          PY

      - name: Hostinger H0 verify
        run: bash bench/cockpit/hostinger-h0-verify.sh

      - name: Surface matrix (TUI KEEP)
        run: bash bench/cockpit/surface-matrix.sh

      - name: scripts/hostinger-grok-build → deploy wrapper
        run: |
          test -x scripts/hostinger-grok-build.sh
          grep -q deploy/hostinger-grok-build-install.sh scripts/hostinger-grok-build.sh

  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Install OS deps
        run: |
          set -euxo pipefail
          echo "BASH_VERSION=${BASH_VERSION:-}"
          uname -sm
          if [[ "${{ matrix.os }}" == ubuntu-latest ]]; then
            sudo apt-get update
            sudo apt-get install -y shellcheck tmux fish zsh inotify-tools
          else
            brew install fswatch shellcheck tmux fish bash
            if echo "$PATH" | grep -qi gnubin; then
              echo "gnubin on PATH is forbidden"
              exit 1
            fi
          fi
          echo "watch backend: $(bash -c 'source bin/cockpit-portable-lib; cockpit_watch_backend')"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Build web + API
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec tsc -p tsconfig.server.json

      - name: Portability suite
        run: |
          set -euxo pipefail
          log="portability-${{ matrix.os }}.log"
          exec > >(tee "$log") 2>&1
          echo "BASH_VERSION=${BASH_VERSION:-}"
          uname -sm
          echo "watch backend: $(bash -c 'source bin/cockpit-portable-lib; cockpit_watch_backend')"
          shellcheck -x -S warning install.sh bin/cockpit-portable-lib bin/cockpit-lib bin/cockpit-agent-lib \
            bin/cockpit-mermaid-watch bin/cockpit-wake bin/cockpit-idle bin/cockpit-adapt bin/cockpit-profile \
            bin/cockpit-reload-views bin/cockpit-plugin
          bash tests/test-portable-lib.sh
          bash tests/test-portability-lint.sh
          bash tests/test-install-shells.sh
          bash tests/test-launchd.sh
          for t in tests/test-*.sh; do
            case "$t" in
              tests/test-portable-lib.sh|tests/test-portability-lint.sh|tests/test-install-shells.sh|tests/test-launchd.sh) continue ;;
            esac
            bash "$t"
          done
          bash bench/cockpit/capability-matrix.sh
          COCKPIT_HOSTINGER=1 node app/dist-server/index.js &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8787/api/health && break
            sleep 0.5
          done
          if [[ "${{ matrix.os }}" == ubuntu-latest ]]; then
            ss -ltnp | grep 127.0.0.1:8787
          else
            lsof -nP -iTCP -sTCP:LISTEN | grep 127.0.0.1:8787
          fi

      - name: Upload portability log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-${{ matrix.os }}
          path: portability-${{ matrix.os }}.log
