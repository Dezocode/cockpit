name: Release Cockpit 2

on:
  push:
    tags:
      - 'v2.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Build release bundle
        env:
          COCKPIT_VERSION: ${{ github.ref_name }}
        run: |
          export COCKPIT_VERSION="${COCKPIT_VERSION#v}"
          bash scripts/release-bundle.sh

      - name: Capability matrix
        run: bash bench/cockpit/capability-matrix.sh

      - uses: ./.github/actions/prove-health

      - name: Stage release assets
        run: |
          mkdir -p /tmp/release-assets
          cp dist/release/cockpit-*-linux-x64.tar.gz dist/release/cockpit-*-web.tar.gz /tmp/release-assets/
          ls -lh /tmp/release-assets/

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            /tmp/release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        continue-on-error: true
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps (Tauri)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri (optional, non-blocking)
        continue-on-error: true
        timeout-minutes: 20
        working-directory: app
        run: |
          pnpm install
          pnpm tauri build --bundles deb,appimage
