name: Release Cockpit 2

on:
  push:
    tags:
      - 'v2.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Build release bundle
        env:
          COCKPIT_VERSION: ${{ github.ref_name }}
        run: |
          export COCKPIT_VERSION="${COCKPIT_VERSION#v}"
          chmod +x scripts/release-bundle.sh scripts/*.sh deploy/*.sh packaging/systemd/*.sh bench/cockpit/*.sh marketing/*.sh
          bash scripts/release-bundle.sh

      - name: Capability matrix
        run: bash bench/cockpit/capability-matrix.sh

      - name: Prove GET /api/health
        run: |
          COCKPIT_HOSTINGER=1 node app/dist-server/index.js &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8787/api/health >/tmp/health.json && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8787/api/health | tee /tmp/health.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/health.json"))
          assert d.get("product") == "cockpit", d
          assert d.get("status") in ("green", "yellow"), d
          assert "checks" in d and d["checks"].get("hostinger") == "configured", d
          assert d.get("source") == "app/dist-server/index.js", d
          print("GET /api/health: ok status=%s source=%s" % (d["status"], d["source"]))
          PY

      - name: Stage release assets
        run: |
          mkdir -p /tmp/release-assets
          cp dist/release/cockpit-*-linux-x64.tar.gz dist/release/cockpit-*-web.tar.gz /tmp/release-assets/
          ls -lh /tmp/release-assets/

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            /tmp/release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        continue-on-error: true
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps (Tauri)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri (optional, non-blocking)
        continue-on-error: true
        timeout-minutes: 20
        working-directory: app
        run: |
          pnpm install
          pnpm tauri build --bundles deb,appimage
